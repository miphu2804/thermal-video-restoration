repos:
  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-isort
        additional_dependencies: [isort==9.0.2]
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black-jupyter
