[project]
name = "thermal-restore"
version = "0.1.0"
description = "Restoring degraded thermal infrared video before object detection (IMP302m)"
authors = [
    { name = "Nguyen Minh Phu", email = "minfus391@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "imagecodecs>=2026.3.6",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pywavelets>=1.9.0",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
    "tifffile>=2026.3.3",
]

[project.optional-dependencies]
detector = [
    "torch>=2.5,<3",
    "torchvision>=0.20,<1",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
known_first_party = ["thermal_restore"]
